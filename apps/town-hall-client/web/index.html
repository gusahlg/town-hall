<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090e14" />
    <title>Town Hall Simulation</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #090e14;
      }

      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #59d6ae;
        letter-spacing: 0.16em;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div id="loading">ASSEMBLING THE TOWN…</div>
    <canvas id="town-hall-canvas"></canvas>
    <script type="module">
      import init from "./pkg/town_hall_client.js";

      init()
        .then(() => document.querySelector("#loading")?.remove())
        .catch((error) => {
          const loading = document.querySelector("#loading");
          if (loading) loading.textContent = `FAILED TO START: ${error}`;
          console.error(error);
        });
    </script>
  </body>
</html>

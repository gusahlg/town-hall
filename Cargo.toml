[workspace]
members = [
    "apps/town-hall-cli",
    "apps/town-hall-client",
    "crates/neuro-ash",
    "crates/town-hall",
    "crates/town-hall-gui",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
anyhow = "1"
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
neuro-ash = { path = "crates/neuro-ash" }
rayon = "1"
tensor-ash = { path = "../tensor-ash" }
town-hall = { path = "crates/town-hall" }
town-hall-gui = { path = "crates/town-hall-gui" }
